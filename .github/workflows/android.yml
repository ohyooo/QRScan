name: Android CI

on:
  push:
  repository_dispatch:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: jdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit

      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}-
            gradle-${{ runner.os }}-

      - name: Build Release AAB
        run: chmod +x gradlew && ./gradlew :app:bundleRelease --build-cache

      - name: Save Gradle cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}-${{ github.run_id }}

      - name: Generate four signed ABI APKs from AAB
        shell: bash
        env:
          APK_KEYSTORE: app/signkey.jks
          APK_KEY_ALIAS: demo
          APK_STORE_PASSWORD: '123456'
          APK_KEY_PASSWORD: '123456'
        run: |
          bash .github/scripts/build-abi-apks.sh app QRScan

      - name: Upload arm64-v8a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/QRScan-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/QRScan-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/QRScan-x86.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/QRScan-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload retrace mapping without ZIP wrapping
        if: ${{ hashFiles('ci-output/abi-apks/QRScan-mapping.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/QRScan-mapping.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 2
